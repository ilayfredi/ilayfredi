<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שטויות בחלל</title>

<meta name="description" content="משחק ארקייד בנגיעה אחת. אתה נעול במסלול סביב כוכב שקורס — נגיעה הופכת את הכיוון. עשרה אזורים, אתגר יומי, ומרוץ מול הרוח של החברים שלך.">
<meta property="og:type" content="website">
<meta property="og:title" content="שטויות בחלל">
<meta property="og:description" content="נגיעה אחת. עשרה אזורים. כמה תחזיק?">
<meta property="og:image" content="https://ilayfredi.github.io/ilayfredi/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://ilayfredi.github.io/ilayfredi/">
<meta name="twitter:card" content="summary_large_image">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#eef3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="שטויות בחלל">

<style>
  :root {
    --sky: #eef3ff; --bg1: #fff4e9; --bg2: #e4ecff;
    --ink: #2a3157; --soft: #737ba6; --faint: #aeb4d1;
    --sun: #ffb454; --coral: #ff6b7a; --teal: #23bfa6; --lilac: #a99bff;
    --card: #ffffff; --line: rgba(42,49,87,0.10); --veil: rgba(238,243,255,0.76);
    --ui: system-ui, -apple-system, "Segoe UI", "Noto Sans Hebrew", Arial, sans-serif;
    --num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sh-sm: 0 2px 10px rgba(20,26,50,0.07);
    --sh-md: 0 10px 30px rgba(20,26,50,0.12);
    --sh-lg: 0 24px 60px rgba(20,26,50,0.17);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: var(--ui); color: var(--ink); background: var(--sky);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }

  #app {
    position: fixed; inset: 0; overflow: hidden;
    background:
      radial-gradient(125% 85% at 50% 4%, var(--bg1) 0%, transparent 60%),
      radial-gradient(110% 75% at 50% 112%, var(--bg2) 0%, transparent 68%),
      var(--sky);
    transition: background 0.5s ease;
  }
  canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #screen { z-index: 1; }
  #hud { z-index: 2; pointer-events: none; }

  .veil {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 15px;
    padding: calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
    text-align: center; overflow-y: auto;
    opacity: 0; visibility: hidden;
    transition: opacity 0.4s ease, visibility 0.4s;
  }
  .veil.on { opacity: 1; visibility: visible; }
  #splash { background: linear-gradient(170deg, var(--bg1) 0%, var(--sky) 58%, var(--bg2) 100%); }
  #home, #about, #over, #getapp {
    background: var(--veil);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }

  .gametitle {
    font-size: clamp(40px, 13vw, 84px); font-weight: 800;
    line-height: 1.06; letter-spacing: -0.015em;
    background: linear-gradient(100deg, var(--sun) 0%, var(--coral) 48%, var(--lilac) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding: 0 .06em .08em; text-wrap: balance;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,.12));
  }
  .splash-eyebrow { font-size: 12px; letter-spacing: .1em; color: var(--faint); }
  .signature { font-size: clamp(28px, 8.5vw, 50px); font-weight: 700; line-height: 1.15; color: var(--ink); margin-top: -6px; }
  .badges { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
  .badge {
    font-size: 12px; font-weight: 600; color: var(--ink);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 13px; box-shadow: var(--sh-sm);
  }
  .praise { font-size: 14.5px; color: var(--soft); max-width: 32ch; min-height: 2.6em; transition: opacity .22s ease; }
  .skip { font-size: 12px; color: var(--faint); letter-spacing: .06em; margin-top: 4px; }
  .flourish {
    width: min(230px, 62vw); height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--sun) 30%, var(--coral) 70%, transparent);
  }
  .rise { animation: rise 1s cubic-bezier(.16,.9,.3,1) both; }
  .rise-2 { animation-delay: .14s; } .rise-3 { animation-delay: .3s; } .rise-4 { animation-delay: .46s; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  .toprow {
    position: absolute; top: calc(13px + env(safe-area-inset-top));
    inset-inline: 14px; display: flex; justify-content: space-between;
    gap: 7px; flex-wrap: wrap;
  }
  .chip {
    font-family: inherit; font-size: 12px; font-weight: 500; color: var(--soft);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 13px; min-height: 36px; cursor: pointer; box-shadow: var(--sh-sm);
    white-space: nowrap;
  }
  .chip:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
  #lang { font-weight: 700; letter-spacing: .04em; }

  .crown { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .crown-label { font-size: 13px; letter-spacing: .1em; color: var(--soft); }
  .crown-num {
    font-size: clamp(48px, 16vw, 92px); font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums; direction: ltr;
    background: linear-gradient(150deg, var(--ink) 0%, var(--lilac) 115%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .crown-sub { font-size: 13px; color: var(--faint); }

  .menu { display: flex; flex-direction: column; gap: 10px; width: min(330px, 86vw); }
  .btn {
    font-family: inherit; font-size: 19px; font-weight: 600; color: #fff;
    border: 0; border-radius: 999px; padding: 15px 24px; min-height: 53px; cursor: pointer;
    background: linear-gradient(140deg, var(--sun) 0%, var(--coral) 100%);
    box-shadow: var(--sh-md);
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .btn:active { transform: translateY(2px) scale(.985); box-shadow: var(--sh-sm); }
  .btn:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; }
  .btn-ghost { background: var(--card); color: var(--ink); box-shadow: var(--sh-sm); border: 1px solid var(--line); font-weight: 500; }
  .btn-lilac { background: linear-gradient(140deg, var(--lilac) 0%, var(--teal) 130%); }
  .btn-teal { background: linear-gradient(140deg, var(--teal) 0%, var(--lilac) 130%); }
  .btn-sm { font-size: 16px; min-height: 45px; padding: 11px 20px; }

  .panel {
    width: min(330px, 86vw); background: var(--card); border-radius: 18px;
    padding: 13px 15px; box-shadow: var(--sh-sm); text-align: start;
  }
  .panel h3 { font-size: 11px; letter-spacing: .06em; color: var(--faint); font-weight: 600; margin-bottom: 8px; }
  .quest { display: flex; align-items: center; gap: 9px; padding: 3px 0; font-size: 13px; }
  .quest .tick {
    flex: 0 0 auto; width: 17px; height: 17px; border-radius: 50%;
    border: 2px solid var(--faint); display: grid; place-items: center; font-size: 10px; color: #fff;
  }
  .quest.done .tick { background: var(--teal); border-color: var(--teal); }
  .quest.done span { color: var(--soft); text-decoration: line-through; }
  .quest .prog { margin-inline-start: auto; font-family: var(--num); font-size: 11px; color: var(--faint); direction: ltr; }

  .styles { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .sty {
    width: 40px; height: 40px; border-radius: 13px; cursor: pointer; padding: 0;
    border: 3px solid transparent; position: relative; overflow: hidden; box-shadow: var(--sh-sm);
  }
  .sty.sel { border-color: var(--ink); }
  .sty:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
  .sty i { position: absolute; inset: 0; }
  .sty b { position: absolute; inset-inline-end: 4px; bottom: 3px; width: 9px; height: 9px; border-radius: 50%; }

  .codebar { display: flex; gap: 7px; width: min(330px, 86vw); }
  .codebar input {
    flex: 1 1 auto; min-width: 0; font-family: var(--num); font-size: 13px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 13px; text-align: start;
  }
  .codebar input::placeholder { font-family: var(--ui); color: var(--faint); }
  .codebar input:focus-visible { outline: 2px solid var(--lilac); outline-offset: 1px; }
  .codebar.bad input { border-color: var(--coral); color: var(--coral); }
  .codebar button {
    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 15px; cursor: pointer; box-shadow: var(--sh-sm); white-space: nowrap;
  }

  .sheet {
    width: min(430px, 92vw); max-height: 60vh; overflow-y: auto;
    background: var(--card); border-radius: 26px; padding: 24px 22px;
    box-shadow: var(--sh-lg); text-align: start;
    scrollbar-width: thin; scrollbar-color: var(--faint) transparent;
  }
  .sheet::-webkit-scrollbar { width: 6px; }
  .sheet::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 3px; }
  .sheet h2 { font-size: 23px; font-weight: 700; margin-bottom: 6px; }
  .sheet .lede { color: var(--soft); font-size: 15px; line-height: 1.65; margin-bottom: 16px; }
  .sheet h3 { font-size: 12px; letter-spacing: .06em; color: var(--faint); margin: 16px 0 8px; }
  .sheet p { font-size: 15px; line-height: 1.7; }
  .steps { list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .steps li { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.55; }
  .dot { flex: 0 0 auto; width: 11px; height: 11px; border-radius: 50%; margin-top: 5px; }
  .signoff { margin-top: 18px; padding-top: 15px; border-top: 1px solid var(--line); font-size: 14px; color: var(--soft); }
  .signoff b { color: var(--ink); font-weight: 600; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; padding: 6px 0; }
  .toggle button {
    font-family: inherit; font-size: 12px; font-weight: 600; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 14px; cursor: pointer; white-space: nowrap;
  }
  .toggle button.off { color: var(--faint); }

  .howto { list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 11px; }
  .howto li { display: flex; gap: 11px; font-size: 14.5px; line-height: 1.5; }
  .howto li::before {
    counter-increment: s; content: counter(s);
    flex: 0 0 auto; width: 23px; height: 23px; border-radius: 50%;
    background: var(--sun); color: #fff; font-size: 12px; font-weight: 700;
    display: grid; place-items: center;
  }

  .card {
    width: min(360px, 90vw); background: var(--card); border-radius: 28px;
    padding: 24px 22px 20px; box-shadow: var(--sh-lg);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .card-label { font-size: 13px; letter-spacing: .1em; color: var(--soft); }
  .card-num {
    font-size: clamp(46px, 14vw, 72px); font-weight: 700; line-height: 1.05;
    font-variant-numeric: tabular-nums; color: var(--ink); direction: ltr;
  }
  .card-sector { font-size: 14px; color: var(--soft); }
  .ribbon {
    font-size: 13px; font-weight: 600; color: #fff;
    background: linear-gradient(130deg, var(--sun) 0%, var(--coral) 100%);
    border-radius: 999px; padding: 6px 15px; margin: 5px 0 2px;
  }
  .stats { display: flex; gap: 6px; width: 100%; margin: 12px 0 4px; }
  .stats div {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px;
  }
  .stats b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; direction: ltr; }
  .stats span { font-size: 11px; color: var(--soft); text-align: center; line-height: 1.25; }
  .card-best { font-size: 14px; color: var(--soft); margin-bottom: 11px; }
  .card-best b { color: var(--ink); font-weight: 700; direction: ltr; display: inline-block; }
  .card .btn { width: 100%; }
  .card .btn + .btn { margin-top: 8px; }
  .linky {
    margin-top: 12px; font-family: inherit; font-size: 14px; font-weight: 500;
    color: var(--soft); background: none; border: 0;
    border-bottom: 1px dashed var(--faint); padding: 3px 1px; cursor: pointer;
  }
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; } .veil { transition: none; } #app { transition: none; }
  }
</style>
</head>
<body>

<div id="app">
  <canvas id="screen"></canvas>
  <canvas id="hud"></canvas>

  <section id="splash" class="veil on">
    <h1 class="gametitle rise" data-i18n="title">שטויות בחלל</h1>
    <div class="flourish rise rise-2"></div>
    <span class="splash-eyebrow rise rise-2" data-i18n="madeBy">נוצר מהראש של</span>
    <p class="signature rise rise-3" data-i18n="author">עילי פרדי</p>
    <div class="badges rise rise-4">
      <span class="badge" data-i18n="badge1">גאון של החלל</span>
      <span class="badge" data-i18n="badge2">אלוף בלתי מעורער</span>
      <span class="badge" data-i18n="badge3">אגדה חיה</span>
    </div>
    <p id="praise" class="praise rise rise-4"></p>
    <span class="skip rise rise-4" data-i18n="skip">גע כדי לדלג</span>
  </section>

  <section id="home" class="veil">
    <div class="toprow">
      <button id="sound" class="chip" type="button"></button>
      <button id="lang" class="chip" type="button">EN</button>
      <button id="btnGet" class="chip" type="button" data-i18n="getApp">הורד לטלפון</button>
    </div>

    <div class="crown">
      <span class="crown-label" data-i18n="bestLabel">השיא</span>
      <strong id="homeBest" class="crown-num">0</strong>
      <span class="crown-sub" data-i18n="title">שטויות בחלל</span>
    </div>

    <div class="menu">
      <button id="btnPlay" class="btn" type="button" data-i18n="play">שחק</button>
      <button id="btnDaily" class="btn btn-lilac btn-sm" type="button" data-i18n="daily">אתגר יומי</button>
      <button id="btnAbout" class="btn btn-ghost btn-sm" type="button" data-i18n="about">קצת עלינו</button>
    </div>

    <div class="panel">
      <h3 data-i18n="questsTitle">משימות היום</h3>
      <div id="questList"></div>
    </div>

    <div class="styles" id="styles"></div>

    <form id="codebar" class="codebar">
      <input id="code" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
             data-i18n-ph="codePh" data-i18n-aria="codeAria">
      <button id="load" type="submit" data-i18n="loadBtn">טען</button>
    </form>
  </section>

  <section id="getapp" class="veil">
    <div class="sheet">
      <h2 data-i18n="getTitle">הורדה לטלפון</h2>
      <p class="lede" data-i18n="getLede"></p>
      <div id="installBox" hidden>
        <div class="menu" style="width:100%"><button id="install" class="btn" type="button" data-i18n="installNow">התקן עכשיו</button></div>
      </div>
      <h3 data-i18n="android">אנדרואיד</h3>
      <ol class="howto">
        <li data-i18n="and1"></li><li data-i18n="and2"></li><li data-i18n="and3"></li>
      </ol>
      <h3 data-i18n="iphone">אייפון</h3>
      <ol class="howto">
        <li data-i18n="ios1"></li><li data-i18n="ios2"></li><li data-i18n="ios3"></li>
      </ol>
      <p class="signoff" data-i18n="getNote"></p>
    </div>
    <div class="menu"><button id="btnGetBack" class="btn btn-ghost" type="button" data-i18n="back">אחורנית</button></div>
  </section>

  <section id="about" class="veil">
    <div class="sheet">
      <h2 data-i18n="about">קצת עלינו</h2>
      <p class="lede" data-i18n="aboutLede"></p>
      <h3 data-i18n="howTitle">איך משחקים</h3>
      <ul class="steps">
        <li><span class="dot" style="background:var(--ink)"></span><span data-i18n="how1"></span></li>
        <li><span class="dot" style="background:var(--teal)"></span><span data-i18n="how2"></span></li>
        <li><span class="dot" style="background:var(--coral)"></span><span data-i18n="how3"></span></li>
        <li><span class="dot" style="background:var(--lilac)"></span><span data-i18n="how4"></span></li>
        <li><span class="dot" style="background:var(--sun)"></span><span data-i18n="how5"></span></li>
      </ul>
      <h3 data-i18n="daily">אתגר יומי</h3>
      <p data-i18n="dailyP"></p>
      <h3 data-i18n="settings">הגדרות</h3>
      <div class="toggle"><span data-i18n="setHaptics">רטט בפגיעה</span><button id="tglHaptics" type="button"></button></div>
      <div class="toggle"><span data-i18n="setMusic">מוזיקה</span><button id="tglMusic" type="button"></button></div>
      <div class="toggle"><span data-i18n="setLang">שפה</span><button id="tglLang" type="button"></button></div>
      <p class="signoff"><span data-i18n="builtBy">נבנה על ידי</span> <b data-i18n="author">עילי פרדי</b></p>
    </div>
    <div class="menu"><button id="btnBack" class="btn btn-ghost" type="button" data-i18n="back">אחורנית</button></div>
  </section>

  <section id="over" class="veil">
    <div class="card">
      <span class="card-label" data-i18n="yourScore">התוצאה שלך</span>
      <strong id="overScore" class="card-num">0</strong>
      <p id="overSector" class="card-sector"></p>
      <p id="overRibbon" class="ribbon" hidden></p>
      <div class="stats">
        <div><b id="stOrbs">0</b><span data-i18n="stOrbs">כדורים</span></div>
        <div><b id="stGraze">0</b><span data-i18n="stGraze">חליפות</span></div>
        <div><b id="stCombo">×1</b><span data-i18n="stCombo">מכפיל שיא</span></div>
      </div>
      <p class="card-best"><span data-i18n="bestColon">השיא:</span> <b id="overBest">0</b></p>
      <button id="btnRevive" class="btn btn-teal" type="button" hidden data-i18n="revive">עוד חיים אחד</button>
      <button id="btnAgain" class="btn" type="button" data-i18n="again">שוב</button>
      <button id="btnQuit" class="btn btn-ghost" type="button" data-i18n="back">אחורנית</button>
      <button id="btnShare" class="linky" type="button" data-i18n="share">שתף את התוצאה</button>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";

  /* ============================================================
     שטויות בחלל / SPACE NONSENSE
     One input: touching anywhere reverses your direction around a
     collapsing star. Ten sectors, each keeping the hazards before
     it and adding one more.

     Every hazard comes from a seeded PRNG plus a fixed-timestep tick
     counter, so a run is fully described by its seed and the frames
     the player tapped on - which is what makes the shareable ghost
     replay and the date-seeded daily challenge nearly free.
     ============================================================ */

  /* ---------- translations ----------
     Every player-visible string lives here. Canvas text goes through
     t() too, so the HUD switches with the menus.                    */
  var L = {
    he: {
      dir: "rtl", htmlLang: "he", other: "EN", otherName: "English",
      title: "שטויות בחלל", author: "עילי פרדי",
      madeBy: "נוצר מהראש של", skip: "גע כדי לדלג",
      badge1: "גאון של החלל", badge2: "אלוף בלתי מעורער", badge3: "אגדה חיה",
      praise: ["האיש שהפך נגיעה אחת למשחק שלם", "עשרה אזורים, אפס פשרות",
               "מתכנת, מעצב, ואלוף המסלול", "כל סלע כאן עבר את האישור שלו"],
      bestLabel: "השיא", bestColon: "השיא:",
      play: "שחק", daily: "אתגר יומי", about: "קצת עלינו",
      questsTitle: "משימות היום",
      codePh: "קוד של חבר", codeAria: "קוד אתגר של חבר",

  /* ---------- hazards ---------- */
  function spawnRock(fromAngle, bias) {

    var tx = CX + Math.cos(ta) * tr, ty = CY + Math.sin(ta) * tr;
    var d = Math.hypot(tx - sx, ty - sy);

  /* ---------- simulation ---------- */
  function update() {
    g.t++;

    if (g.ahead > 0) g.ahead--;
    if (g.banner > 0) g.banner--;
    if (g.bestFlash > 0) g.bestFlash--;
    if (g.pulse > 0) g.pulse -= 0.075;

    for (var pi = 0; pi < pops.length; pi++) { pops[pi].y -= 0.9; pops[pi].life -= 0.018; }
    pops = pops.filter(function (p) { return p.life > 0; });

    for (var m = 0; m < motes.length; m++) {
      motes[m].y += motes[m].d;
      if (motes[m].y > U) { motes[m].y = 0; motes[m].x = Math.random() * U; }
    }

    var live = g.state === PLAY;
    if (g.state === TITLE) stepOrbiter(ship, g.t);

    if (live) {
      var sec = Math.min(SECTORS().length - 1, Math.floor(g.t / SECTOR));
      if (sec !== g.sector) {
        g.sector = sec; g.banner = 130;
        sfx.sector(); buzz([12, 40, 12]);
        if (sec === 3) sfx.charge();
      }
      if (has("shrink")) {
        var into = Math.min(1, (g.t - SECTOR * 8) / (SECTOR * 2.2));
        orbit = ORBIT - 52 * into;
      } else orbit = ORBIT;

      if (beamsLive()) { g.beamPower = Math.min(1, g.beamPower + 1 / 110); g.beamA += 0.0075 * g.beamDir; }
      if (g.iframes > 0) g.iframes--;
      stepOrbiter(ship, g.t);
      g.score += 1 + g.sector;

      if (ghost && ghost.alive) {
        while (ghost.idx < challenge.flips.length && challenge.flips[ghost.idx] === g.t) {
          ghost.dir *= -1; ghost.boost = BOOST_N; ghost.idx++;

        stepOrbiter(ghost, g.t);
        if (g.t > challenge.death) ghost.alive = false;
      }
      if (challenge && !dailyMode && !g.passed && g.score > challenge.score) {
        g.passed = true; g.ahead = 110; sfx.ahead();
      }
      if (!g.beatBest && best > 0 && g.score > best) {
        g.beatBest = true; g.bestFlash = 120; sfx.ahead(); buzz([15, 50, 15]);
      }

      var warm = Math.min(1, g.t / 320);
      var rate = Math.max(19, (66 - g.t / 118) + (1 - warm) * 42);
      if (++g.rockClock > rate) {
        g.rockClock = 0;
        var from = rnd() * Math.PI * 2;
        var fast = has("fast") ? 0.5 + Math.min(1.1, g.sector * 0.14) : 0;
        spawnRock(from, fast);
        if (has("cross") && rnd() < (0.2 + g.sector * 0.045)) spawnRock(from + Math.PI, 0.3 + fast);
        if (has("storm") && rnd() < 0.16) {
          var spread = 0.5 + rnd() * 0.5;
          spawnRock(from + spread, fast);
          spawnRock(from - spread, fast);

      if (++g.orbClock > 108) {

        orbs.push({ a: rnd() * Math.PI * 2, life: 470, drift: (rnd() - 0.5) * 0.004 });
      }
      if (++g.shieldClock > 300 && shields.length < 2 && g.shield < 2 && rnd() < 0.06) {

      }
    }

    for (var i = 0, n0 = rocks.length; i < n0; i++) {
      var r = rocks[i];
      if (r.dead) continue;
      r.x += r.vx; r.y += r.vy; r.ang += r.spin;
      var dc = Math.hypot(r.x - CX, r.y - CY);
      if (live && has("shatter") && !r.split && r.r > 32 && dc < orbit + 46) { shatter(r); continue; }
      if (dc < 62) { r.dead = true; for (var q = 0; q < 7; q++) spark(r.x, r.y, C.sun, 2.4, 0.7); }
      if (dc > 900) r.dead = true;
    }

    }
    for (var sI = 0; sI < shields.length; sI++) if (--shields[sI].life <= 0) shields[sI].dead = true;

    if (live) {

      for (var sJ = 0; sJ < shields.length; sJ++) {
        var sh = shields[sJ];
        if (sh.dead) continue;
        var shp = onRing(sh.a);
        if (Math.hypot(p.x - shp.x, p.y - shp.y) < 36) {
          sh.dead = true;

          sfx.shield(); buzz([10, 30, 10]);
          for (var s2 = 0; s2 < 16; s2++) spark(shp.x, shp.y, C.lilac, 3, 1);
        }
      }
      for (var j = 0; j < rocks.length; j++) {
        var rk = rocks[j];
        if (rk.dead) continue;
        var dist = Math.hypot(p.x - rk.x, p.y - rk.y);

  function takeHit(p) {

      g.shake = REDUCED ? 0 : 12; g.flash = 0.6;
      sfx.hit(); buzz(25);
      for (var s = 0; s < 18; s++) spark(p.x, p.y, C.lilac, 3.4, 1);
      return;
    }
    g.combo = 1; g.lives--; g.iframes = 96;
    g.shake = REDUCED ? 0 : 20; g.flash = 1;
    for (var b = 0; b < 26; b++) spark(p.x, p.y, C.coral, 4, 1.2);
    if (g.lives <= 0) {
      sfx.dead(); buzz([60, 40, 90]); musicStop();
      run.score = g.score; run.death = g.t; run.sector = g.sector; run.daily = dailyMode;
      lastRun = run;
      commitQuests();
      g.wasBest = g.score > best;
      if (g.wasBest) { best = g.score; lsSet("od-best", String(best)); }
      paintBest();
      finishRun();
    } else { sfx.hit(); buzz(35); }
  }
  function finishRun() {
    $("overScore").textContent = g.score.toLocaleString();
    $("overSector").textContent = t("zone") + " " + (g.sector + 1) + " · " + SECTORS()[g.sector].name;
    $("stOrbs").textContent = g.orbsGot;
    $("stGraze").textContent = g.grazes;
    $("stCombo").textContent = "×" + g.bestCombo;
    var rb = $("overRibbon");
    if (challenge && !dailyMode) {
      rb.hidden = false;
      rb.textContent = g.score > challenge.score ? t("youWin") : t("rivalHolds");
    } else if (g.wasBest) { rb.hidden = false; rb.textContent = t("newBest"); }
    else rb.hidden = true;
    $("btnRevive").hidden = g.revived;
    g.state = OVER;
    show("over");
  }

  /* ---------- render ---------- */
  function stroke(color, w, alpha, path) {
    ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = w;
    ctx.beginPath(); path(); ctx.stroke();
  }
  function fill(color, alpha, path) {
    ctx.fillStyle = color; ctx.globalAlpha = alpha;
    ctx.beginPath(); path(); ctx.fill();
  }
  function chevron() { ctx.moveTo(0, -19); ctx.lineTo(12, 13); ctx.lineTo(0, 5); ctx.lineTo(-12, 13); ctx.closePath(); }
  function rockPath(r) {
    return function () {
      for (var i = 0; i <= 8; i++) {
        var a = (i / 8) * Math.PI * 2 + r.ang;
        var rad = r.r * (0.74 + (((r.seed + i * 53) % 11) / 34));
        var x = r.x + Math.cos(a) * rad, y = r.y + Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
    };
  }
  function drawBeams() {
    if (!beamsLive()) return;
    var n = beamCount(), pw = g.beamPower, half = 0.105, reach = 560;
    var col = pw >= 1 ? C.coral : C.sun;
    for (var b = 0; b < n; b++) {
      var ba = g.beamA + b * (Math.PI * 2 / n);
      var x1 = CX + Math.cos(ba - half) * reach, y1 = CY + Math.sin(ba - half) * reach;
      var x2 = CX + Math.cos(ba + half) * reach, y2 = CY + Math.sin(ba + half) * reach;
      fill(col, 0.05 + 0.07 * pw, function () { ctx.moveTo(CX, CY); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.closePath(); });
      stroke(col, 2, 0.14 + 0.3 * pw, function () {
        ctx.moveTo(CX, CY); ctx.lineTo(CX + Math.cos(ba) * reach, CY + Math.sin(ba) * reach);
      });
    }
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.fillStyle = REDUCED ? C.sky : C.wash;
    ctx.fillRect(0, 0, cw, ch);

    ctx.setTransform(S, 0, 0, S, ox, oy);
    if (g.shake > 1) ctx.translate((Math.random() - 0.5) * g.shake, (Math.random() - 0.5) * g.shake);
    ctx.lineJoin = "round"; ctx.lineCap = "round";

    for (var m = 0; m < motes.length; m++) {
      var mo = motes[m];
      fill(C.faint, 0.45, function () { ctx.arc(mo.x, mo.y, mo.s * 0.6, 0, 6.2832); });
    }
    drawBeams();
    stroke(C.faint, 9, 0.16, function () { ctx.arc(CX, CY, orbit, 0, 6.2832); });
    stroke(C.faint, 1.6, 0.9, function () { ctx.arc(CX, CY, orbit, 0, 6.2832); });

    var pulse = 1 + Math.sin(g.t * 0.035) * 0.045;
    var rad = (56 + (ORBIT - orbit) * 0.55) * pulse;
    var grd = ctx.createRadialGradient(CX, CY, rad * 0.2, CX, CY, rad * 3.1);
    grd.addColorStop(0, C.sun); grd.addColorStop(0.3, C.sun + "70"); grd.addColorStop(1, C.sun + "00");
    ctx.globalAlpha = 0.75; ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(CX, CY, rad * 3.1, 0, 6.2832); ctx.fill();
    stroke(C.sun, 2, 0.35, function () { ctx.arc(CX, CY, rad * 1.55, 0, 6.2832); });
    fill(C.sun, 1, function () { ctx.arc(CX, CY, rad, 0, 6.2832); });
    fill("#ffffff", 0.42, function () { ctx.arc(CX - rad * 0.24, CY - rad * 0.26, rad * 0.46, 0, 6.2832); });

    for (var i = 0; i < rocks.length; i++) {
      var rp = rockPath(rocks[i]);
      fill(C.coral, 0.18, rp);
      stroke(C.coral, 2.8, 0.95, rp);
    }
    for (var o = 0; o < orbs.length; o++) {
      var ob = orbs[o], op = onRing(ob.a);
      var fade = ob.life < 90 ? (Math.floor(ob.life / 6) % 2 ? 0.3 : 1) : 1;
      fill(C.teal, 0.16 * fade, function () { ctx.arc(op.x, op.y, 25, 0, 6.2832); });
      fill(C.teal, fade, function () { ctx.arc(op.x, op.y, 9.5, 0, 6.2832); });
      fill("#ffffff", 0.5 * fade, function () { ctx.arc(op.x - 3, op.y - 3.4, 3.2, 0, 6.2832); });
    }
    for (var sI = 0; sI < shields.length; sI++) {
      var sh = shields[sI], shp = onRing(sh.a);
      var bl = sh.life < 90 && Math.floor(sh.life / 6) % 2 ? 0.3 : 1;
      fill(C.lilac, 0.16 * bl, function () { ctx.arc(shp.x, shp.y, 24, 0, 6.2832); });
      stroke(C.lilac, 3.4, bl, function () { ctx.arc(shp.x, shp.y, 13.5, 0, 6.2832); });
    }
    if (ghost && ghost.alive && g.state === PLAY) {
      var gp = posOf(ghost);
      ctx.save(); ctx.translate(gp.x, gp.y); ctx.rotate(ghost.a + (Math.PI / 2) * ghost.dir);
      stroke(C.lilac, 3, 0.75, chevron);
      ctx.restore();
    }
    if (g.state !== OVER) {
      var sa = ship.a, sd = ship.dir;
      var sx = CX + Math.cos(sa) * orbit, sy = CY + Math.sin(sa) * orbit;
      if (g.pulse > 0) {
        stroke(C.ship, 2.5, g.pulse * 0.55, function () { ctx.arc(sx, sy, 20 + (1 - g.pulse) * 40, 0, 6.2832); });
      }
      var blink = g.iframes > 0 && Math.floor(g.t / 4) % 2 === 0;
      if (!blink) {
        ctx.save(); ctx.translate(sx, sy); ctx.rotate(sa + (Math.PI / 2) * sd);
        fill(C.ship, 1, chevron);
        stroke(C.ship, 12, 0.09, chevron);
        ctx.restore();
        for (var q2 = 0; q2 < g.shield; q2++) {
          stroke(C.lilac, 2.6, 0.75 - q2 * 0.18, function () { ctx.arc(sx, sy, 27 + q2 * 7, 0, 6.2832); });
        }
      }
    }
    for (var c2 = 0; c2 < bits.length; c2++) {
      var bt = bits[c2];
      ctx.globalAlpha = Math.max(0, bt.life) * 0.85;
      ctx.fillStyle = bt.c;
      ctx.beginPath(); ctx.arc(bt.x, bt.y, 2.6, 0, 6.2832); ctx.fill();
    }
    if (g.flash > 0) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = g.flash * 0.2; ctx.fillStyle = C.coral;
      ctx.fillRect(0, 0, cw, ch);
    }
    drawHud();
  }

  function drawHud() {
    var rtl = t("dir") === "rtl";
    h.setTransform(dpr, 0, 0, dpr, 0, 0);
    h.clearRect(0, 0, VW, VH);
    h.globalAlpha = 1; h.textBaseline = "top"; h.direction = t("dir");

    if (g.state === PLAY && has("dark")) {
      var sp = toCss(posOf(ship));
      var r0 = Math.min(VW, VH) * 0.22, r1 = Math.min(VW, VH) * 0.62;
      var eg = h.createRadialGradient(sp.x, sp.y, r0, sp.x, sp.y, r1);
      eg.addColorStop(0, C.sky + "00"); eg.addColorStop(0.55, C.sky + "9e"); eg.addColorStop(1, C.sky + "f7");
      h.fillStyle = eg; h.fillRect(0, 0, VW, VH);
    }
    if (g.state !== PLAY) return;

    // score numbers keep a left-to-right sign no matter the ui language
    h.textAlign = "center"; h.direction = "ltr";
    for (var pi = 0; pi < pops.length; pi++) {
      var pp = pops[pi], sc = toCss({ x: pp.x, y: pp.y });
      h.globalAlpha = Math.max(0, Math.min(1, pp.life * 1.6));
      h.fillStyle = pp.c;
      h.font = "700 " + Math.min(17, VW * 0.043) + "px system-ui, sans-serif";
      h.fillText(pp.txt, sc.x, sc.y);
    }
    h.direction = t("dir"); h.globalAlpha = 1;

    var pad = 22, big = Math.min(38, VW * 0.098);
    var SEC = SECTORS();

    var prog = (g.t % SECTOR) / SECTOR;
    if (g.sector < SEC.length - 1) {
      h.fillStyle = C.faint; h.globalAlpha = 0.28;
      h.fillRect(0, 0, VW, 3);
      h.globalAlpha = 1; h.fillStyle = C[SEC_TINT[g.sector]];
      h.fillRect(rtl ? VW * (1 - prog) : 0, 0, VW * prog, 3);
    }

    // score sits on the reading-start side, lives on the other
    var sx2 = rtl ? VW - pad : pad;
    h.textAlign = rtl ? "right" : "left";
    h.font = "700 " + big + "px system-ui, -apple-system, sans-serif";
    h.fillStyle = C.ink;
    h.fillText(g.score.toLocaleString(), sx2, pad);

    var line = pad + big + 6;
    h.font = "600 " + Math.min(14, VW * 0.037) + "px system-ui, sans-serif";
    h.fillStyle = C[SEC_TINT[g.sector]];
    h.fillText(t("zone") + " " + (g.sector + 1) + " · " + SEC[g.sector].name, sx2, line);
    line += 22;
    if (dailyMode) { h.fillStyle = C.lilac; h.fillText(t("daily"), sx2, line); line += 22; }
    if (g.combo > 1) {
      h.direction = "ltr";
      h.fillStyle = C.teal; h.fillText("×" + g.combo, sx2, line);
      h.direction = t("dir"); line += 22;
    }
    if (challenge && !dailyMode) {
      h.fillStyle = g.passed ? C.sun : C.faint;
      h.fillText(t("rival") + " " + challenge.score.toLocaleString(), sx2, line);
    }

    var lx = rtl ? pad + 9 : VW - pad - 9;
    var stepx = rtl ? 25 : -25;
    for (var i = 0; i < 3; i++) {
      h.globalAlpha = i < g.lives ? 1 : 0.18;
      h.fillStyle = C.coral;
      h.beginPath(); h.arc(lx + i * stepx, pad + 12, 8, 0, 6.2832); h.fill();
    }
    h.globalAlpha = 1;
    for (var sK = 0; sK < g.shield; sK++) {
      h.strokeStyle = C.lilac; h.lineWidth = 2.6;
      h.beginPath(); h.arc(lx + (3 + sK) * stepx, pad + 12, 7.5, 0, 6.2832); h.stroke();
    }

    if (g.banner > 0) {
      h.globalAlpha = Math.min(1, g.banner / 34);
      h.textAlign = "center";
      h.fillStyle = C[SEC_TINT[g.sector]];
      h.font = "700 " + Math.min(40, VW * 0.1) + "px system-ui, sans-serif";
      h.fillText(SEC[g.sector].name, VW / 2, VH * 0.4);
      h.fillStyle = C.soft;
      h.font = "500 " + Math.min(16, VW * 0.042) + "px system-ui, sans-serif";
      h.fillText(SEC[g.sector].blurb, VW / 2, VH * 0.4 + Math.min(48, VW * 0.12));
      h.globalAlpha = 1;
    }
    if (g.ahead > 0) {
      h.globalAlpha = Math.min(1, g.ahead / 30);
      h.textAlign = "center"; h.fillStyle = C.sun;
      h.font = "700 " + Math.min(30, VW * 0.075) + "px system-ui, sans-serif";
      h.fillText(t("passed"), VW / 2, VH * 0.26);
      h.globalAlpha = 1;
    }
    if (g.bestFlash > 0) {
      h.globalAlpha = Math.min(1, g.bestFlash / 34);
      h.textAlign = "center"; h.fillStyle = C.sun;
      h.font = "700 " + Math.min(30, VW * 0.076) + "px system-ui, sans-serif";
      h.fillText(t("brokeBest"), VW / 2, VH * 0.18);
      h.globalAlpha = 1;
    }
  }

  /* ---------- loop ---------- */
  var acc = 0, prev = performance.now();
  function loop(now) {
    if (app.clientWidth !== VW || app.clientHeight !== VH) fit();
    var dt = Math.min(now - prev, 120);
    prev = now;
    acc += dt;
    var steps = 0;
    while (acc >= STEP && steps < 5) { update(); acc -= STEP; steps++; }
    draw();
    requestAnimationFrame(loop);
  }

  /* ---------- install ---------- */
  var deferredPrompt = null;
  addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); deferredPrompt = e;
    $("installBox").hidden = false;
  });
  $("install").addEventListener("click", function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () { deferredPrompt = null; $("installBox").hidden = true; });
  });
  if ("serviceWorker" in navigator) {
    addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }

  /* ---------- boot ---------- */
  applyStyle(parseInt(lsGet("od-style", "0"), 10) || 0, false);
  reset(true);
  applyLang(false);
  fit();
  requestAnimationFrame(loop);

  var praiseI = 0, praiseTimer = setInterval(function () {
    var list = t("praise");
    praiseI = (praiseI + 1) % list.length;
    var el = $("praise");
    if (el) { el.style.opacity = "0"; setTimeout(function () { el.textContent = t("praise")[praiseI]; el.style.opacity = "1"; }, 220); }
  }, 1500);
  function leaveSplash() {
    if (view !== "splash") return;
    clearInterval(praiseTimer);
    show("home");
  }
  $("splash").addEventListener("pointerdown", leaveSplash);
  setTimeout(leaveSplash, 4200);
})();
</script>
</body>
</html>
