<title>Orbit Decay</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --void:      #080a12;
    --void-deep: #03040a;
    --beam:      #7fe3ff;
    --hazard:    #ff5470;
    --plasma:    #ffc857;
    --core:      #fff3d6;
    --ghost:     #9db4d8;
    --dim:       #5c6b8a;
    --rule:      #18203a;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--void-deep);
    color: var(--beam);
    font-family: var(--sans);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }

  .cabinet {
    /* the screen is square and wants height, but the chrome must never collapse */
    width: min(94vw, max(250px, 62dvh), 580px);
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  /* ---------- marquee ---------- */
  .marquee {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }
  .wordmark {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--beam);
    white-space: nowrap;
  }
  .wordmark span { color: var(--plasma); }
  .best {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .best b { color: var(--plasma); font-weight: 600; }

  /* ---------- screen ---------- */
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    border: 1px solid var(--rule);
    background: var(--void);
    box-shadow: 0 0 60px rgba(127, 227, 255, 0.05), inset 0 0 80px rgba(0, 0, 0, 0.7);
  }
  /* #screen keeps its phosphor trails and is never cleared;
     #hud is wiped every frame so the score stays crisp */
  .stage canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #screen { z-index: 0; }
  #hud    { z-index: 1; pointer-events: none; }
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0px,
      rgba(0, 0, 0, 0) 2px,
      rgba(0, 0, 0, 0.15) 3px,
      rgba(0, 0, 0, 0.15) 4px
    );
  }

  /* ---------- deck ---------- */
  .deck {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 9px;
    border-top: 1px solid var(--rule);
  }
  .codebar { display: flex; gap: 6px; flex: 1 1 148px; min-width: 0; }
  .codebar input {
    flex: 1 1 auto;
    min-width: 0;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--plasma);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 9px;
  }
  .codebar input::placeholder { color: var(--dim); letter-spacing: 0.13em; text-transform: uppercase; }
  .codebar input:focus-visible { outline: 2px solid var(--plasma); outline-offset: 2px; }
  .codebar.bad input { border-color: var(--hazard); color: var(--hazard); }
  .controls { display: flex; gap: 6px; flex-shrink: 0; }
  button {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--beam);
    background: transparent;
    border: 1px solid rgba(127, 227, 255, 0.26);
    border-radius: 2px;
    padding: 9px 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  button:hover { background: rgba(127, 227, 255, 0.09); border-color: rgba(127, 227, 255, 0.5); }
  button:focus-visible { outline: 2px solid var(--plasma); outline-offset: 2px; }
  button.muted { color: var(--dim); border-color: var(--rule); }
  button.done { color: var(--plasma); border-color: rgba(255, 200, 87, 0.55); }

  @media (max-width: 470px) {
    .wordmark { letter-spacing: 0.24em; font-size: 10px; }
    .best { font-size: 10px; }
    button { padding: 9px 9px; letter-spacing: 0.1em; }
    .codebar { flex-basis: 100%; order: 2; }
    .controls { order: 1; width: 100%; }
    .controls button { flex: 1 1 auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage { box-shadow: none; }
  }
</style>

<main class="cabinet">
  <div class="marquee">
    <h1 class="wordmark">Orbit<span>&middot;</span>Decay</h1>
    <p class="best">BEST <b id="best">0</b></p>
  </div>

  <div class="stage">
    <canvas id="screen"></canvas>
    <canvas id="hud"></canvas>
  </div>

  <div class="deck">
    <div class="controls">
      <button id="sound" type="button" aria-label="Toggle sound">Sound</button>
      <button id="share" type="button">Challenge</button>
    </div>
    <form class="codebar" id="codebar">
      <input id="code" type="text" placeholder="rival code" autocomplete="off"
             autocapitalize="off" spellcheck="false"
             aria-label="Paste a rival code to race their run">
      <button type="submit" id="load">Load</button>
    </form>
  </div>
</main>

<script>
(function () {
  "use strict";

  /* ============================================================
     ORBIT DECAY
     One input. You are locked in orbit around a collapsing star;
     tapping reverses your direction of travel. Nothing else.

     Six sectors, each keeping every hazard before it and adding
     one more, so the same single control keeps getting harder
     to use well.

     The trick that makes this shareable: every hazard is driven
     by a seeded PRNG and a fixed-timestep tick counter, so a whole
     run is described by its seed plus the frames the player tapped
     on. That compresses to a short string, which travels in the
     link's hash or pasted into the code box. Either way your friend
     flies your exact run with the ghost of it beside them.
     ============================================================ */

  /* ---------- 1. config ---------- */
  var U       = 1000;             // logical field, 1000 x 1000
  var CX      = 500, CY = 500;    // star centre
  var ORBIT   = 268;              // nominal orbit radius
  var STEP    = 1000 / 60;        // fixed simulation tick
  var W_BASE  = 0.0265;           // base angular velocity
  var SECTOR  = 800;              // ticks per sector (~13s)
  var REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var MONO    = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';

  // Each sector keeps everything before it and adds one new idea.
  // The tints run cool to hot as the star turns on you.
  var SECTORS = [
    { name: "DRIFT",     blurb: "debris on straight lines",      tint: "#7fe3ff" },
    { name: "CROSSFIRE", blurb: "it comes from both sides now",  tint: "#8ad4ff" },
    { name: "PULSAR",    blurb: "the star is firing. mind the sweep", tint: "#ffc857" },
    { name: "SHATTER",   blurb: "the big ones break apart",      tint: "#ff9a6e" },
    { name: "ECLIPSE",   blurb: "you only see what is near you", tint: "#9db4d8" },
    { name: "COLLAPSE",  blurb: "the orbit is falling in",       tint: "#ff5470" }
  ];

  var cv       = document.getElementById("screen");
  var ctx      = cv.getContext("2d");
  var hc       = document.getElementById("hud");
  var h        = hc.getContext("2d");
  var bestEl   = document.getElementById("best");
  var shareBtn = document.getElementById("share");
  var soundBtn = document.getElementById("sound");
  var codebar  = document.getElementById("codebar");
  var codeIn   = document.getElementById("code");
  var loadBtn  = document.getElementById("load");

  /* ---------- 2. seeded rng (gameplay only) ---------- */
  var _s = 1;
  function seedRng(n) { _s = n >>> 0; }
  function rnd() {                                  // mulberry32
    _s = (_s + 0x6D2B79F5) >>> 0;
    var t = _s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  // Math.random stays in use for purely cosmetic things (sparks,
  // screen shake, motes) - they never feed back into the sim.

  /* ---------- 3. canvas sizing ----------
     phones get the same logical field at a capped pixel count, so a
     big desktop screen never makes the per-frame fills expensive   */
  var scale = 1;
  function fit() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var css = cv.clientWidth || 320;
    var px  = Math.min(Math.round(css * dpr), 1100);
    cv.width  = hc.width  = px;
    cv.height = hc.height = px;
    scale = px / U;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    h.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = "#080a12";
    ctx.fillRect(0, 0, U, U);
  }
  addEventListener("resize", fit);
  addEventListener("orientationchange", function () { setTimeout(fit, 120); });

  /* ---------- 4. audio ---------- */
  var ac = null, muted = false;
  function tone(type, f0, f1, dur, vol) {
    if (muted) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      var t = ac.currentTime;
      var o = ac.createOscillator(), gn = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.exponentialRampToValueAtTime(vol, t + 0.012);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(gn); gn.connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* no audio available - the game just runs silent */ }
  }
  var sfx = {
    flip:   function ()  { tone("square",   400, 250, 0.07, 0.05); },
    orb:    function (n) { tone("sine",     520 * Math.pow(1.06, Math.min(n, 14)), 900, 0.14, 0.09); },
    graze:  function ()  { tone("triangle", 1500, 1900, 0.04, 0.03); },
    hit:    function ()  { tone("sawtooth", 190, 55, 0.34, 0.13); },
    dead:   function ()  { tone("sawtooth", 340, 40, 0.9, 0.14); },
    ahead:  function ()  { tone("sine",     660, 1320, 0.5, 0.11); },
    sector: function ()  { tone("square",   220, 880, 0.5, 0.075); },
    charge: function ()  { tone("sawtooth", 80, 420, 1.1, 0.06); },
    split:  function ()  { tone("square",   300, 120, 0.12, 0.05); }
  };

  /* ---------- 5. stored best ---------- */
  var best = 0;
  try { best = parseInt(localStorage.getItem("orbit-decay-best"), 10) || 0; } catch (e) {}
  function saveBest() { try { localStorage.setItem("orbit-decay-best", String(best)); } catch (e) {} }
  function paintBest() { bestEl.textContent = best.toLocaleString(); }

  /* ---------- 6. challenge codec ----------
     [seed, score, deathFrame, ...flipDeltas] -> base36, dot joined  */
  function encodeRun(r) {
    var out = [r.seed, r.score, r.death], prev = 0;
    for (var i = 0; i < r.flips.length; i++) {
      out.push(r.flips[i] - prev);
      prev = r.flips[i];
    }
    return out.map(function (n) { return (n >>> 0).toString(36); }).join(".");
  }
  function decodeRun(code) {
    try {
      // accept a bare code or a whole pasted link containing one
      var m = /[#&?]c=([^&\s]+)/.exec(code);
      var body = (m ? m[1] : code).trim();
      try { body = decodeURIComponent(body); } catch (e2) {}
      if (!/^[0-9a-z.]+$/i.test(body)) return null;

      var p = body.split(".").map(function (s) { return parseInt(s, 36); });
      if (p.length < 3 || p.length > 4000) return null;
      for (var v = 0; v < p.length; v++) {
        if (!isFinite(p[v]) || p[v] < 0) return null;
      }
      if (p[2] > 5000000) return null;                 // implausible run length

      var flips = [], acc = 0;
      for (var i = 3; i < p.length; i++) { acc += p[i]; flips.push(acc); }
      return { seed: p[0] >>> 0, score: p[1], death: p[2], flips: flips };
    } catch (e) { return null; }
  }

  function pageUrl() {
    // inside the artifact viewer the page may be framed; prefer the
    // address the reader would actually see
    try {
      if (window.top !== window && window.top.location.href) return window.top.location.href;
    } catch (e) {}
    if (document.referrer && /^https?:/.test(document.referrer)) return document.referrer;
    return location.href;
  }
  function stripHash(u) { return u.split("#")[0]; }

  // A challenge can arrive two ways: in the link's hash (when the page is
  // served at a real address) or pasted into the code box. The paste path
  // always works, so the link never has to be trusted.
  var challenge = null;
  if (location.hash) challenge = decodeRun(location.hash);

  /* ---------- 7. state ---------- */
  var TITLE = 0, PLAY = 1, OVER = 2;
  var g, ship, ghost, rocks, orbs, bits, run;
  var orbit = ORBIT;

  var motes = [];
  for (var mi = 0; mi < 40; mi++) {
    motes.push({ x: Math.random() * U, y: Math.random() * U, d: Math.random() * 0.25 + 0.05 });
  }

  function reset(toTitle) {
    var seed = challenge ? challenge.seed : (Math.random() * 0x7fffffff) >>> 0;
    seedRng(seed);

    g = {
      state: toTitle ? TITLE : PLAY,
      score: 0, lives: 3, combo: 1, t: 0,
      rockClock: 0, orbClock: 0,
      shake: 0, iframes: 0, lock: 0, flash: 0,
      ahead: 0, passed: false,
      sector: 0, banner: 0,
      beamA: rnd() * Math.PI * 2,
      beamDir: rnd() < 0.5 ? -1 : 1,
      beamPower: 0
    };
    ship  = { a: -Math.PI / 2, dir: 1, boost: 0 };
    ghost = challenge ? { a: -Math.PI / 2, dir: 1, boost: 0, idx: 0, alive: true } : null;
    rocks = []; orbs = []; bits = [];
    orbit = ORBIT;
    run   = { seed: seed, score: 0, death: 0, sector: 0, flips: [] };
  }

  /* ---------- 8. shared orbital mechanics ----------
     player and ghost step through identical maths, which is what
     makes a replay from flip-times exact                        */
  function angularVelocity(t) { return W_BASE + Math.min(t / 460000, 0.014); }
  function stepOrbiter(o, t) {
    var w = angularVelocity(t) + (o.boost > 0 ? 0.020 * (o.boost / 10) : 0);
    if (o.boost > 0) o.boost--;
    o.a += w * o.dir;
  }
  function posOf(o) { return { x: CX + Math.cos(o.a) * orbit, y: CY + Math.sin(o.a) * orbit }; }
  function onRing(a) { return { x: CX + Math.cos(a) * orbit, y: CY + Math.sin(a) * orbit }; }

  // smallest signed angle between two headings
  function angleGap(a, b) {
    var d = (a - b) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  function spark(x, y, color, speed, life) {
    var a = Math.random() * Math.PI * 2, s = Math.random() * speed + 0.6;
    bits.push({
      x: x, y: y, vx: Math.cos(a) * s * 2.4, vy: Math.sin(a) * s * 2.4,
      life: life || 1, decay: 0.02 + Math.random() * 0.02, c: color
    });
  }

  function beamCount() { return g.sector >= 5 ? 3 : 2; }
  function beamsLive()  { return g.sector >= 2; }
  function tint()       { return SECTORS[g.sector].tint; }

  /* ---------- 9. input ---------- */
  function press() {
    if (g.state === TITLE) { sfx.flip(); reset(false); return; }
    if (g.state === OVER)  { if (g.lock <= 0) reset(false); return; }
    ship.dir *= -1;
    ship.boost = 10;
    run.flips.push(g.t + 1);          // takes effect on the next tick
    sfx.flip();
    var p = posOf(ship);
    for (var i = 0; i < 6; i++) spark(p.x, p.y, "#7fe3ff", 2.2, 0.5);
  }

  cv.addEventListener("pointerdown", function (e) { e.preventDefault(); press(); });
  addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (k === " " || k === "arrowleft" || k === "arrowright" || k === "enter") {
      // never steal keys from the controls or the code box
      var tag = e.target && e.target.tagName;
      if (tag === "BUTTON" || tag === "INPUT" || tag === "TEXTAREA") return;
      e.preventDefault();
      press();
    }
  });

  soundBtn.addEventListener("click", function () {
    muted = !muted;
    soundBtn.classList.toggle("muted", muted);
    soundBtn.textContent = muted ? "Muted" : "Sound";
    if (!muted) sfx.flip();
  });

  /* ---------- 10. load a rival's code ---------- */
  codebar.addEventListener("submit", function (e) {
    e.preventDefault();
    if (codeIn.blur) codeIn.blur();               // drop the phone keyboard
    var raw = codeIn.value.trim();

    if (!raw) {                                    // empty box clears the rival
      challenge = null;
      codebar.classList.remove("bad");
      reset(true);
      return;
    }
    var decoded = decodeRun(raw);
    if (!decoded) {
      codebar.classList.add("bad");
      loadBtn.textContent = "Bad code";
      setTimeout(function () {
        codebar.classList.remove("bad");
        loadBtn.textContent = "Load";
      }, 2000);
      return;
    }
    challenge = decoded;
    codebar.classList.remove("bad");
    loadBtn.textContent = "Loaded";
    setTimeout(function () { loadBtn.textContent = "Load"; }, 2000);
    reset(true);                                   // back to the challenge card
  });

  /* ---------- 11. share ---------- */
  var lastRun = null;
  function shareText() {
    var base = stripHash(pageUrl());
    if (lastRun && lastRun.score > 0) {
      var code = encodeRun(lastRun);
      return "ORBIT DECAY - I scored " + lastRun.score.toLocaleString() +
             " and reached sector " + (lastRun.sector + 1) +
             " (" + SECTORS[lastRun.sector].name + ").\n" +
             "Same debris field, my ghost to race:\n" +
             base + "#c=" + code + "\n" +
             "(if the link drops the code, paste this into the game: " + code + ")";
    }
    return "ORBIT DECAY - one tap, six sectors, don't die:\n" + base;
  }
  shareBtn.addEventListener("click", function () {
    var msg = shareText();
    function ok() {
      shareBtn.textContent = "Copied";
      shareBtn.classList.add("done");
      setTimeout(function () {
        shareBtn.textContent = "Challenge";
        shareBtn.classList.remove("done");
      }, 2000);
    }
    function legacy() {
      try {
        var ta = document.createElement("textarea");
        ta.value = msg;
        ta.style.position = "fixed";
        ta.style.top = "-1000px";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        ok();
      } catch (e) { shareBtn.textContent = "Failed"; }
    }
    if (navigator.share && /Mobi|Android/i.test(navigator.userAgent)) {
      navigator.share({ text: msg }).then(function () {}, legacy);
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(msg).then(ok, legacy);
    } else { legacy(); }
  });

  /* ---------- 12. hazards ---------- */
  function spawnRock(fromAngle, speedBias) {
    var sx = CX + Math.cos(fromAngle) * 760;
    var sy = CY + Math.sin(fromAngle) * 760;
    // aim a little off-centre so paths cut chords, not just spokes
    var ta = rnd() * Math.PI * 2, tr = rnd() * 92;
    var tx = CX + Math.cos(ta) * tr, ty = CY + Math.sin(ta) * tr;
    var d  = Math.hypot(tx - sx, ty - sy);
    var sp = 3.0 + rnd() * 1.5 + Math.min(g.t / 5200, 2.6) + (speedBias || 0);
    rocks.push({
      x: sx, y: sy, vx: (tx - sx) / d * sp, vy: (ty - sy) / d * sp,
      r: 20 + rnd() * 20, ang: rnd() * 6.28, spin: (rnd() - 0.5) * 0.05,
      grazed: false, split: false, seed: Math.floor(rnd() * 999)
    });
  }

  function shatter(r) {
    var base = Math.atan2(r.vy, r.vx);
    var sp = Math.hypot(r.vx, r.vy) * 1.1;
    for (var i = 0; i < 2; i++) {
      var a = base + (i === 0 ? -0.34 : 0.34);
      rocks.push({
        x: r.x, y: r.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: r.r * 0.58, ang: r.ang, spin: (i ? 1 : -1) * 0.06,
        grazed: false, split: true, seed: (r.seed * 7 + i * 131) % 999
      });
    }
    r.dead = true;
    for (var q = 0; q < 9; q++) spark(r.x, r.y, "#ff5470", 2.6, 0.7);
    sfx.split();
  }

  /* ---------- 13. simulation ---------- */
  function update() {
    g.t++;
    if (g.shake > 0) g.shake *= 0.88;
    if (g.flash > 0) g.flash -= 0.06;
    if (g.lock > 0) g.lock--;
    if (g.ahead > 0) g.ahead--;
    if (g.banner > 0) g.banner--;

    for (var m = 0; m < motes.length; m++) {
      motes[m].y += motes[m].d;
      if (motes[m].y > U) { motes[m].y = 0; motes[m].x = Math.random() * U; }
    }

    var live = g.state === PLAY;

    // the attract screen keeps the ship coasting so the page never looks dead
    if (g.state === TITLE) stepOrbiter(ship, g.t);

    if (live) {
      // ---- sector progression, driven by ticks so replays match ----
      var sec = Math.min(SECTORS.length - 1, Math.floor(g.t / SECTOR));
      if (sec !== g.sector) {
        g.sector = sec;
        g.banner = 130;
        sfx.sector();
        if (sec === 2) sfx.charge();
      }

      // COLLAPSE pulls the orbit inward toward the swelling star
      if (g.sector >= 5) {
        var into = Math.min(1, (g.t - SECTOR * 5) / (SECTOR * 1.6));
        orbit = ORBIT - 54 * into;
      } else {
        orbit = ORBIT;
      }

      // PULSAR sweep charges up once, then stays lethal
      if (beamsLive()) {
        g.beamPower = Math.min(1, g.beamPower + 1 / 110);
        g.beamA += 0.0075 * g.beamDir;
      }

      if (g.iframes > 0) g.iframes--;
      stepOrbiter(ship, g.t);
      g.score += 1 + g.sector;

      // ghost replays its recorded taps against the same clock
      if (ghost && ghost.alive) {
        while (ghost.idx < challenge.flips.length && challenge.flips[ghost.idx] === g.t) {
          ghost.dir *= -1;
          ghost.boost = 10;
          ghost.idx++;
        }
        stepOrbiter(ghost, g.t);
        if (g.t > challenge.death) ghost.alive = false;
      }

      if (challenge && !g.passed && g.score > challenge.score) {
        g.passed = true;
        g.ahead = 110;
        sfx.ahead();
      }

      // ---- debris ----
      var rate = Math.max(13, 52 - g.t / 90);
      if (++g.rockClock > rate) {
        g.rockClock = 0;
        var from = rnd() * Math.PI * 2;
        spawnRock(from, 0);
        // CROSSFIRE: a mirrored volley from the far side
        if (g.sector >= 1 && rnd() < (g.sector >= 5 ? 0.85 : 0.5)) {
          spawnRock(from + Math.PI, 0.3);
        }
      }

      // ---- plasma ----
      if (++g.orbClock > 108) {
        g.orbClock = 0;
        orbs.push({ a: rnd() * Math.PI * 2, life: 470, drift: (rnd() - 0.5) * 0.004 });
      }
    }

    // snapshot the length so fragments born this tick wait for the next one
    for (var i = 0, n0 = rocks.length; i < n0; i++) {
      var r = rocks[i];
      if (r.dead) continue;
      r.x += r.vx; r.y += r.vy; r.ang += r.spin;
      var dc = Math.hypot(r.x - CX, r.y - CY);

      // SHATTER: the big ones break as they reach the ring
      if (live && g.sector >= 3 && !r.split && r.r > 29 && dc < orbit + 46) {
        shatter(r);
        continue;
      }
      if (dc < 62) {                                   // burns up in the star
        r.dead = true;
        for (var q = 0; q < 7; q++) spark(r.x, r.y, "#ffc857", 2.4, 0.7);
      }
      if (dc > 900) r.dead = true;
    }

    for (var o = 0; o < orbs.length; o++) {
      orbs[o].a += orbs[o].drift;
      if (--orbs[o].life <= 0) orbs[o].dead = true;
    }

    if (live) {
      var p = posOf(ship);

      for (var k = 0; k < orbs.length; k++) {
        var ob = orbs[k];
        if (ob.dead) continue;
        var op = onRing(ob.a);
        if (Math.hypot(p.x - op.x, p.y - op.y) < 34) {
          ob.dead = true;
          g.combo = Math.min(g.combo + 1, 25);
          g.score += Math.round(55 * g.combo * (1 + g.sector * 0.4));
          sfx.orb(g.combo);
          for (var s = 0; s < 12; s++) spark(op.x, op.y, "#ffc857", 3, 1);
        }
      }

      for (var j = 0; j < rocks.length; j++) {
        var rk = rocks[j];
        if (rk.dead) continue;
        var dist = Math.hypot(p.x - rk.x, p.y - rk.y);
        if (!rk.grazed && dist < rk.r + 52) {          // reward cutting it fine
          rk.grazed = true;
          g.score += Math.round(26 * g.combo * (1 + g.sector * 0.4));
          sfx.graze();
        }
        if (g.iframes <= 0 && dist < rk.r + 13) {
          rk.dead = true;
          takeHit(p);
        }
      }

      // PULSAR: caught in the sweep
      if (beamsLive() && g.beamPower >= 1 && g.iframes <= 0) {
        var n = beamCount();
        for (var b = 0; b < n; b++) {
          var ba = g.beamA + b * (Math.PI * 2 / n);
          if (Math.abs(angleGap(ship.a, ba)) < 0.105) { takeHit(p); break; }
        }
      }
    }

    for (var c = 0; c < bits.length; c++) {
      var bt = bits[c];
      bt.x += bt.vx; bt.y += bt.vy;
      bt.vx *= 0.96; bt.vy *= 0.96;
      bt.life -= bt.decay;
    }

    rocks = rocks.filter(function (x) { return !x.dead; });
    orbs  = orbs.filter(function (x) { return !x.dead; });
    bits  = bits.filter(function (x) { return x.life > 0; });
  }

  function takeHit(p) {
    g.combo = 1;
    g.lives--;
    g.iframes = 96;
    g.shake = REDUCED ? 0 : 22;
    g.flash = 1;
    for (var b = 0; b < 26; b++) spark(p.x, p.y, "#ff5470", 4, 1.2);
    if (g.lives <= 0) {
      g.state = OVER;
      g.lock = 42;
      sfx.dead();
      run.score = g.score;
      run.death = g.t;
      run.sector = g.sector;
      lastRun = run;
      if (g.score > best) { best = g.score; saveBest(); paintBest(); }
    } else {
      sfx.hit();
    }
  }

  /* ---------- 14. render ---------- */
  function beam(color, width, alpha, path) {
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = width;
    ctx.beginPath();
    path();
    ctx.stroke();
  }
  function glow(color, path) {          // phosphor bloom: wide dim + tight bright
    beam(color, 11, 0.13, path);
    beam(color, 2.6, 1, path);
  }
  function chevron() {
    ctx.moveTo(0, -19); ctx.lineTo(12, 13); ctx.lineTo(0, 5); ctx.lineTo(-12, 13);
    ctx.closePath();
  }
  function rockPath(r) {
    return function () {
      for (var i = 0; i <= 8; i++) {
        var a = (i / 8) * Math.PI * 2 + r.ang;
        var rad = r.r * (0.74 + (((r.seed + i * 53) % 11) / 34));
        var x = r.x + Math.cos(a) * rad, y = r.y + Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
    };
  }

  function drawBeams() {
    if (!beamsLive()) return;
    var n = beamCount(), pw = g.beamPower;
    var half = 0.105, reach = 520;
    var col = pw >= 1 ? "#ff5470" : "#ffc857";
    for (var b = 0; b < n; b++) {
      var ba = g.beamA + b * (Math.PI * 2 / n);
      var x1 = CX + Math.cos(ba - half) * reach, y1 = CY + Math.sin(ba - half) * reach;
      var x2 = CX + Math.cos(ba + half) * reach, y2 = CY + Math.sin(ba + half) * reach;

      ctx.globalAlpha = 0.03 + 0.045 * pw;            // the wedge itself
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(CX, CY); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.closePath();
      ctx.fill();

      beam(col, 2, 0.09 + 0.13 * pw, function () {
        ctx.moveTo(CX, CY); ctx.lineTo(x1, y1);
        ctx.moveTo(CX, CY); ctx.lineTo(x2, y2);
      });

      // the phosphor trail smears the wedge wider than it really is,
      // so mark the true centre of the kill line
      beam(col, 1.4, 0.10 + 0.30 * pw, function () {
        ctx.moveTo(CX, CY);
        ctx.lineTo(CX + Math.cos(ba) * reach, CY + Math.sin(ba) * reach);
      });
    }
  }

  function draw() {
    // phosphor persistence: wash the screen, never clear it
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.fillStyle = REDUCED ? "rgba(8,10,18,0.92)" : "rgba(8,10,18,0.30)";
    ctx.fillRect(0, 0, U, U);

    if (g.shake > 1) ctx.translate((Math.random() - 0.5) * g.shake, (Math.random() - 0.5) * g.shake);

    ctx.globalCompositeOperation = "lighter";
    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    ctx.globalAlpha = 0.05;
    ctx.fillStyle = "#7fe3ff";
    for (var m = 0; m < motes.length; m++) ctx.fillRect(motes[m].x, motes[m].y, 2, 2);

    drawBeams();

    beam(tint(), 1.4, 0.12, function () { ctx.arc(CX, CY, orbit, 0, 6.2832); });

    // the collapsing star - swells as the orbit falls in
    var pulse = 1 + Math.sin(g.t * 0.035) * 0.045;
    var rad = (58 + (ORBIT - orbit) * 0.55) * pulse;
    var grd = ctx.createRadialGradient(CX, CY, 4, CX, CY, rad * 2.5);
    grd.addColorStop(0, "rgba(255,243,214,0.95)");
    grd.addColorStop(0.28, "rgba(255,200,87,0.5)");
    grd.addColorStop(1, "rgba(255,84,112,0)");
    ctx.globalAlpha = 1;
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(CX, CY, rad * 2.5, 0, 6.2832); ctx.fill();
    glow("#fff3d6", function () { ctx.arc(CX, CY, rad, 0, 6.2832); });

    for (var i = 0; i < rocks.length; i++) glow("#ff5470", rockPath(rocks[i]));

    for (var o = 0; o < orbs.length; o++) {
      var ob = orbs[o];
      var op = onRing(ob.a);
      var fade = ob.life < 90 ? (Math.floor(ob.life / 6) % 2 ? 0.25 : 1) : 1;
      ctx.globalAlpha = 0.22 * fade;
      ctx.fillStyle = "#ffc857";
      ctx.beginPath(); ctx.arc(op.x, op.y, 22, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = fade;
      ctx.beginPath(); ctx.arc(op.x, op.y, 8.5, 0, 6.2832); ctx.fill();
    }

    // rival ghost
    if (ghost && ghost.alive && g.state === PLAY) {
      var gp = posOf(ghost);
      ctx.save();
      ctx.translate(gp.x, gp.y);
      ctx.rotate(ghost.a + (Math.PI / 2) * ghost.dir);
      beam("#9db4d8", 2, 0.5, chevron);
      ctx.restore();
    }

    // you
    if (g.state !== OVER) {
      var p = posOf(ship);
      var blink = g.iframes > 0 && Math.floor(g.t / 4) % 2 === 0;
      if (!blink) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(ship.a + (Math.PI / 2) * ship.dir);
        glow("#7fe3ff", chevron);
        ctx.restore();
      }
    }

    for (var c = 0; c < bits.length; c++) {
      var bt = bits[c];
      ctx.globalAlpha = Math.max(0, bt.life) * 0.9;
      ctx.fillStyle = bt.c;
      ctx.fillRect(bt.x - 2, bt.y - 2, 4.5, 4.5);
    }

    if (g.flash > 0) {
      ctx.globalAlpha = g.flash * 0.16;
      ctx.fillStyle = "#ff5470";
      ctx.fillRect(0, 0, U, U);
    }

    drawHud();
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
  }

  function pad(n) {
    var s = String(n);
    while (s.length < 6) s = "0" + s;
    return s;
  }
  function two(n) { return (n < 10 ? "0" : "") + n; }

  function drawHud() {
    var ctx = h;                       // everything below lands on the HUD layer
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, U, U);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.textBaseline = "top";

    // ECLIPSE: only the space near the ship stays lit
    if (g.state === PLAY && g.sector >= 4) {
      var sp = posOf(ship);
      var eg = ctx.createRadialGradient(sp.x, sp.y, 100, sp.x, sp.y, 400);
      eg.addColorStop(0, "rgba(3,4,10,0)");
      eg.addColorStop(0.55, "rgba(3,4,10,0.46)");
      eg.addColorStop(1, "rgba(3,4,10,0.9)");
      ctx.fillStyle = eg;
      ctx.fillRect(0, 0, U, U);
    }

    if (g.state === PLAY || g.state === OVER) {
      ctx.font = "600 40px " + MONO;
      ctx.textAlign = "left";
      ctx.fillStyle = "#7fe3ff";
      ctx.fillText(pad(g.score), 30, 28);

      for (var i = 0; i < 3; i++) {          // pips burn out from the right
        ctx.globalAlpha = (2 - i) < g.lives ? 1 : 0.16;
        ctx.fillStyle = "#ff5470";
        ctx.beginPath(); ctx.arc(U - 42 - i * 30, 46, 8, 0, 6.2832); ctx.fill();
      }
      ctx.globalAlpha = 1;

      var line = 76;
      ctx.font = "600 22px " + MONO;
      ctx.fillStyle = tint();
      ctx.fillText("SECTOR " + two(g.sector + 1) + "  " + SECTORS[g.sector].name, 30, line);
      line += 30;

      if (g.combo > 1) {
        ctx.font = "600 26px " + MONO;
        ctx.fillStyle = "#ffc857";
        ctx.fillText("x" + g.combo, 30, line);
        line += 32;
      }
      if (challenge) {
        ctx.font = "600 22px " + MONO;
        ctx.fillStyle = g.passed ? "#ffc857" : "#5c6b8a";
        ctx.fillText("RIVAL " + pad(challenge.score), 30, line);
      }
    }

    // sector announcement
    if (g.banner > 0 && g.state === PLAY) {
      ctx.globalAlpha = Math.min(1, g.banner / 34);
      ctx.fillStyle = "rgba(3,4,10,0.62)";
      ctx.fillRect(0, 388, U, 186);
      centre([
        { t: "SECTOR " + two(g.sector + 1), size: 28, c: "#5c6b8a", sp: 8, gap: 32 },
        { t: SECTORS[g.sector].name, size: 60, c: tint(), sp: 8, gap: 28 },
        { t: SECTORS[g.sector].blurb, size: 21, c: "#5c6b8a", gap: 0 }
      ], 406);
      ctx.globalAlpha = 1;
    }

    if (g.ahead > 0 && g.state === PLAY) {
      ctx.globalAlpha = Math.min(1, g.ahead / 30);
      centre([{ t: "YOU'RE AHEAD", size: 46, c: "#ffc857", sp: 7, gap: 0 }], 152);
      ctx.globalAlpha = 1;
    }

    if (g.state === TITLE) {
      // the star sits dead centre, so the card needs its own ground
      ctx.fillStyle = "rgba(3,4,10,0.76)";
      ctx.fillRect(0, 0, U, U);
      if (challenge) {
        centre([
          { t: "CHALLENGE", size: 34, c: "#ffc857", sp: 7, gap: 40 },
          { t: pad(challenge.score), size: 78, c: "#7fe3ff", sp: 2, gap: 44 },
          { t: "same debris field. their ghost is", size: 23, c: "#5c6b8a", gap: 32 },
          { t: "flying beside you. beat the number.", size: 23, c: "#5c6b8a", gap: 76 },
          { t: Math.floor(g.t / 30) % 2 ? "TAP TO BEGIN" : " ", size: 30, c: "#ffc857", sp: 4, gap: 0 }
        ]);
      } else {
        centre([
          { t: "ORBIT DECAY", size: 60, c: "#7fe3ff", sp: 8, gap: 46 },
          { t: "one input. tap to flip your orbit.", size: 23, c: "#5c6b8a", gap: 32 },
          { t: "six sectors, each one worse", size: 23, c: "#5c6b8a", gap: 32 },
          { t: "than the last.", size: 23, c: "#5c6b8a", gap: 70 },
          { t: Math.floor(g.t / 30) % 2 ? "TAP TO BEGIN" : " ", size: 30, c: "#ffc857", sp: 4, gap: 0 }
        ]);
      }
    }

    if (g.state === OVER) {
      ctx.fillStyle = "rgba(3,4,10,0.84)";
      ctx.fillRect(0, 0, U, U);
      var verdict, vcol;
      if (challenge) {
        verdict = g.score > challenge.score ? "YOU WIN" : "RIVAL HOLDS";
        vcol    = g.score > challenge.score ? "#ffc857" : "#5c6b8a";
      } else {
        verdict = (g.score >= best && g.score > 0) ? "NEW BEST" : "BEST  " + pad(best);
        vcol    = "#ffc857";
      }
      centre([
        { t: "ORBIT LOST", size: 52, c: "#ff5470", sp: 6, gap: 46 },
        { t: pad(g.score), size: 70, c: "#7fe3ff", sp: 2, gap: 34 },
        { t: "SECTOR " + two(g.sector + 1) + "  " + SECTORS[g.sector].name, size: 23, c: tint(), sp: 3, gap: 32 },
        { t: verdict, size: 25, c: vcol, sp: 3, gap: 32 },
        { t: "press Challenge to send this run", size: 19, c: "#5c6b8a", gap: 38 },
        { t: g.lock > 0 ? " " : (Math.floor(g.t / 30) % 2 ? "TAP TO FLY AGAIN" : " "), size: 25, c: "#5c6b8a", sp: 3, gap: 0 }
      ]);
    }
  }

  // canvas has no letter-spacing, so tracked lines are set glyph by glyph
  function centre(lines, forceY) {
    var ctx = h;
    var total = 0, i;
    for (i = 0; i < lines.length; i++) total += lines[i].size + (lines[i].gap || 0);
    var y = forceY !== undefined ? forceY : CY - total / 2 - 40;
    for (i = 0; i < lines.length; i++) {
      var L = lines[i];
      ctx.font = "600 " + L.size + "px " + MONO;
      ctx.fillStyle = L.c;
      if (L.sp) {
        var chars = L.t.split(""), w = 0, j;
        for (j = 0; j < chars.length; j++) w += ctx.measureText(chars[j]).width + L.sp;
        w -= L.sp;
        var x = CX - w / 2;
        ctx.textAlign = "left";
        for (j = 0; j < chars.length; j++) {
          ctx.fillText(chars[j], x, y);
          x += ctx.measureText(chars[j]).width + L.sp;
        }
      } else {
        ctx.textAlign = "center";
        ctx.fillText(L.t, CX, y);
      }
      y += L.size + (L.gap || 0);
    }
    ctx.textAlign = "left";
  }

  /* ---------- 15. fixed-timestep loop ----------
     the sim must advance in equal ticks or replays desync on
     120Hz displays                                            */
  var acc = 0, prev = performance.now();
  function loop(now) {
    var dt = Math.min(now - prev, 120);
    prev = now;
    acc += dt;
    var steps = 0;
    while (acc >= STEP && steps < 5) { update(); acc -= STEP; steps++; }
    draw();
    requestAnimationFrame(loop);
  }

  reset(true);
  paintBest();
  fit();
  requestAnimationFrame(loop);
})();
</script>
